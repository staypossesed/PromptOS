name: Validate PromptOS
on:
  push:
    branches:
      - master
      - feat/admin-prompt-generator
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-ci-public-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - id: dependencies
        run: npm ci
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm test
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npx tsc --noEmit
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run build
